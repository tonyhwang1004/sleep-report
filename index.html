<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>김엄마독서실 졸음관리</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font-family:'Apple SD Gothic Neo','맑은 고딕',sans-serif; background:#f0f2f5; min-height:100vh; }

.header { background:#1a237e; color:white; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.header h1 { font-size:17px; font-weight:700; }
.hright { text-align:right; font-size:12px; opacity:.9; line-height:1.6; }

.warn-banner { display:none; position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:200; align-items:center; justify-content:center; padding:20px; }
.warn-banner.show { display:flex; }
.warn-box  { background:#c62828; border-radius:18px; padding:30px 24px; text-align:center; width:100%; max-width:340px; animation:warnpop .3s ease; }
@keyframes warnpop { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.warn-icon { font-size:52px; margin-bottom:10px; }
.warn-name { font-size:28px; font-weight:800; color:white; }
.warn-sub  { font-size:14px; color:rgba(255,255,255,.85); margin:8px 0 22px; line-height:1.6; }
.btn-penalty { background:white; color:#c62828; border:none; border-radius:10px; padding:14px 0; width:100%; font-size:16px; font-weight:700; cursor:pointer; margin-bottom:10px; }
.btn-wclose  { background:rgba(255,255,255,.2); color:white; border:none; border-radius:10px; padding:12px 0; width:100%; font-size:14px; cursor:pointer; }

.success-banner { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:200; align-items:center; justify-content:center; padding:20px; }
.success-banner.show { display:flex; }
.success-box { background:white; border-radius:20px; padding:32px 24px; text-align:center; width:100%; max-width:320px; animation:spop .3s cubic-bezier(.34,1.56,.64,1); }
@keyframes spop { from{transform:scale(.75);opacity:0} to{transform:scale(1);opacity:1} }
.success-icon  { font-size:56px; margin-bottom:10px; }
.success-title { font-size:22px; font-weight:800; color:#1a237e; margin-bottom:6px; }
.success-period{ font-size:15px; color:#555; margin-bottom:4px; }
.success-count { font-size:13px; color:#888; margin-bottom:8px; }
.success-total { display:inline-block; background:#e8eaf6; color:#1a237e; border-radius:12px; padding:6px 18px; font-size:16px; font-weight:800; margin-bottom:22px; }
.success-total.warn { background:#ffebee; color:#c62828; }
.btn-ok { background:#1a237e; color:white; border:none; border-radius:12px; padding:14px 0; width:100%; font-size:16px; font-weight:700; cursor:pointer; }

.toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px); background:#1b5e20; color:white; border-radius:14px; padding:14px 22px; font-size:14px; font-weight:700; z-index:300; transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .35s; opacity:0; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,.25); max-width:300px; white-space:pre-line; line-height:1.6; }
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
.toast.err  { background:#c62828; }

.tabs { display:flex; background:white; border-bottom:1px solid #e0e0e0; position:sticky; top:49px; z-index:99; }
.tab  { flex:1; padding:11px 4px; border:none; background:none; font-size:13px; font-weight:600; color:#999; cursor:pointer; border-bottom:2px solid transparent; transition:all .2s; }
.tab.active { color:#1a237e; border-bottom-color:#1a237e; }

.container { padding:14px; max-width:480px; margin:0 auto; }

.pbadge     { display:inline-block; border-radius:20px; padding:5px 13px; font-size:12px; font-weight:700; margin-bottom:14px; }
.pbadge.on  { background:#e8eaf6; color:#1a237e; }
.pbadge.brk { background:#fff3e0; color:#e65100; }
.pbadge.off { background:#fce4ec; color:#c62828; }

.card  { background:white; border-radius:14px; padding:18px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
.card h3 { font-size:15px; color:#222; margin-bottom:14px; font-weight:700; }

.floor-tabs { display:flex; gap:10px; margin-bottom:14px; }
.floor-tab  { flex:1; padding:14px 10px; border:2px solid #e0e0e0; border-radius:12px; background:white; font-size:15px; font-weight:700; cursor:pointer; text-align:center; transition:all .2s; color:#555; }
.floor-tab .fn { display:block; font-size:22px; font-weight:800; }
.floor-tab .fs { display:block; font-size:12px; color:#999; margin-top:2px; }
.floor-tab.active      { border-color:#1a237e; background:#e8eaf6; color:#1a237e; }
.floor-tab.active .fs  { color:#5c6bc0; }
.floor-tab.f7.active   { border-color:#2e7d32; background:#e8f5e9; color:#2e7d32; }
.floor-tab.f7.active .fs { color:#388e3c; }

.view-toggle { display:flex; gap:8px; margin-bottom:12px; }
.vt-btn { flex:1; padding:9px; border:1.5px solid #ddd; border-radius:9px; background:white; font-size:13px; font-weight:600; cursor:pointer; color:#666; transition:all .15s; text-align:center; }
.vt-btn.active { border-color:#1a237e; background:#e8eaf6; color:#1a237e; }

.grid-hint { font-size:12px; color:#888; font-weight:600; margin-bottom:8px; }
.seat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(60px,1fr)); gap:7px; max-height:260px; overflow-y:auto; padding:2px; }
.seat-btn  { padding:10px 4px; border:1.5px solid #e0e0e0; border-radius:10px; background:white; font-size:12px; font-weight:700; cursor:pointer; text-align:center; transition:all .15s; color:#333; line-height:1.4; }
.seat-btn:active { transform:scale(.94); }
.seat-btn.sel    { border-color:#1a237e; background:#1a237e; color:white; }
.seat-btn.sel8   { border-color:#1a237e; background:#1a237e; color:white; }
.seat-btn.sel7   { border-color:#2e7d32; background:#2e7d32; color:white; }
.seat-btn .sn    { display:block; font-size:16px; font-weight:800; }
.seat-btn .snm   { display:block; font-size:10px; color:#999; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:54px; }
.seat-btn.sel8 .snm, .seat-btn.sel7 .snm { color:rgba(255,255,255,.75); }

.search-wrap { position:relative; margin-bottom:10px; }
.search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:15px; color:#aaa; pointer-events:none; }
.search-wrap input { width:100%; padding:12px 14px 12px 40px; border:1.5px solid #ddd; border-radius:10px; font-size:16px; background:#fafafa; transition:border-color .2s; }
.search-wrap input:focus { outline:none; border-color:#1a237e; background:white; }
.name-list { max-height:260px; overflow-y:auto; border:1.5px solid #e8eaf6; border-radius:10px; }
.name-item { padding:12px 16px; border-bottom:1px solid #f0f0f0; cursor:pointer; display:flex; align-items:center; justify-content:space-between; transition:background .15s; }
.name-item:last-child { border:none; }
.name-item:hover { background:#f5f5f5; }
.name-item.sel   { background:#e8eaf6; }
.ni-name { font-size:15px; font-weight:700; }
.ni-seat { font-size:12px; color:#999; background:#f5f5f5; border-radius:8px; padding:2px 8px; }
.name-item.sel .ni-seat { background:#c5cae9; color:#1a237e; }

.confirm-box  { background:#e8eaf6; border-radius:10px; padding:13px 16px; margin:12px 0 14px; display:none; border-left:4px solid #1a237e; }
.confirm-box.show { display:block; }
.confirm-box.f7   { background:#e8f5e9; border-left-color:#2e7d32; }
.confirm-name { font-size:22px; font-weight:800; color:#1a237e; }
.confirm-box.f7 .confirm-name { color:#2e7d32; }
.confirm-seat { font-size:13px; color:#555; margin-top:3px; }

.btn         { width:100%; padding:14px; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; transition:all .15s; }
.btn-primary { background:#1a237e; color:white; }
.btn-primary.f7 { background:#2e7d32; }
.btn-primary:active   { transform:scale(.98); }
.btn-primary:disabled { background:#bdbdbd; cursor:not-allowed; }
.btn-gray { background:#f5f5f5; color:#555; font-size:14px; padding:11px; margin-top:10px; }

.today-item { padding:12px 0; border-bottom:1px solid #f0f0f0; }
.today-item:last-child { border:none; }
.today-top  { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.t-left     { display:flex; align-items:center; gap:8px; }
.t-name     { font-size:15px; font-weight:700; }
.t-floor    { font-size:11px; color:white; border-radius:8px; padding:2px 8px; }
.t-floor.f8 { background:#1a237e; }
.t-floor.f7 { background:#2e7d32; }
.t-seat     { font-size:11px; color:#999; background:#f5f5f5; border-radius:8px; padding:2px 8px; }
.t-total    { border-radius:12px; padding:3px 12px; font-size:13px; font-weight:800; }
.t-ok       { background:#e8eaf6; color:#1a237e; }
.t-warn     { background:#ffebee; color:#c62828; }
.chips      { display:flex; flex-wrap:wrap; gap:5px; }
.chip       { background:#f5f5f5; border-radius:8px; padding:3px 9px; font-size:12px; color:#555; }
.chip.has   { background:#ffcdd2; color:#c62828; font-weight:700; }

.rep-text { white-space:pre-wrap; word-break:break-word; font-size:13px; line-height:1.7; background:#fafafa; border:1px solid #eee; border-radius:10px; padding:14px; margin-top:12px; font-family:inherit; max-height:420px; overflow-y:auto; }
.empty       { text-align:center; padding:30px; color:#bbb; font-size:14px; }
.loading-txt { text-align:center; padding:24px; color:#aaa; font-size:14px; }
.pen-pt-btn { flex:1; padding:10px; border:1.5px solid #ddd; border-radius:9px; background:white; font-size:14px; font-weight:700; cursor:pointer; color:#666; transition:all .15s; text-align:center; }
.pen-pt-btn.active { border-color:#c62828; background:#ffebee; color:#c62828; }
.pen-list-item { padding:10px 0; border-bottom:1px solid #f0f0f0; display:flex; align-items:center; justify-content:space-between; }
.pen-list-item:last-child { border:none; }
.pen-name { font-size:15px; font-weight:700; }
.pen-total { background:#ffebee; color:#c62828; border-radius:10px; padding:3px 12px; font-size:13px; font-weight:800; }
</style>
</head>
<body>

<div class="header">
  <h1>📚 김엄마독서실</h1>
  <div class="hright">
    <div id="clock">--:--:--</div>
    <div id="periodHeader">로딩중...</div>
  </div>
</div>

<div class="warn-banner" id="warnBanner">
  <div class="warn-box">
    <div class="warn-icon">🚨</div>
    <div class="warn-name" id="warnName"></div>
    <div class="warn-sub">누적 <span id="warnCount"></span>회 졸음!<br>담당자 확인 후 벌점을 부여하세요.</div>
    <button class="btn-penalty" id="btnPenalty">벌점 1점 부여</button>
    <button class="btn-wclose"  id="btnCloseWarn">나중에 처리</button>
  </div>
</div>

<div class="success-banner" id="successBanner">
  <div class="success-box">
    <div class="success-icon">✅</div>
    <div class="success-title" id="succName"></div>
    <div class="success-period" id="succPeriod"></div>
    <div class="success-count"  id="succCount"></div>
    <div class="success-total"  id="succTotal"></div>
    <button class="btn-ok" id="btnSuccessOk">확인</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="tabs">
  <button class="tab active" id="tabRecord">졸음기록</button>
  <button class="tab"        id="tabToday">오늘기록</button>
  <button class="tab"        id="tabPenalty">벌점</button>
  <button class="tab"        id="tabReport">리포트</button>
</div>

<div class="container">

  <!-- ① 졸음기록 탭 -->
  <div id="tab-record">
    <div class="card">
      <span class="pbadge off" id="periodBadge">로딩중...</span>
      <h3>학생 선택</h3>
      <div class="floor-tabs">
        <button class="floor-tab active" id="floorBtn8"><span class="fn">8층</span><span class="fs">8층 학생</span></button>
        <button class="floor-tab f7" id="floorBtn7"><span class="fn">7층</span><span class="fs">7층 학생</span></button>
      </div>
      <div class="view-toggle">
        <button class="vt-btn active" id="vtSeat">🔢 번호로 찾기</button>
        <button class="vt-btn"        id="vtName">🔤 이름으로 찾기</button>
      </div>
      <div id="view-seat">
        <div class="grid-hint">번호를 눌러 학생을 선택하세요</div>
        <div class="seat-grid" id="seatGrid"><div class="loading-txt">로딩중...</div></div>
      </div>
      <div id="view-name" style="display:none">
        <div class="search-wrap"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="이름 검색..."></div>
        <div class="name-list" id="nameList"><div class="loading-txt">로딩중...</div></div>
      </div>
      <div class="confirm-box" id="confirmBox">
        <div class="confirm-name" id="confirmName"></div>
        <div class="confirm-seat" id="confirmSeat"></div>
      </div>
      <button class="btn btn-primary" id="recordBtn" disabled>😴 졸음 기록</button>
    </div>
  </div>

  <!-- ② 오늘기록 탭 -->
  <div id="tab-today" style="display:none">
    <div class="card">
      <h3>📋 오늘의 졸음 현황</h3>
      <div id="todayContent" class="loading-txt">로딩중...</div>
    </div>
  </div>

  <!-- ③ 벌점 탭 -->
  <div id="tab-penalty" style="display:none">
    <div class="card">
      <h3>🚨 수동 벌점 부여</h3>
      <div class="floor-tabs" style="margin-bottom:12px">
        <button class="floor-tab active" id="penFloorBtn8"><span class="fn">8층</span><span class="fs">8층 학생</span></button>
        <button class="floor-tab f7" id="penFloorBtn7"><span class="fn">7층</span><span class="fs">7층 학생</span></button>
      </div>
      <div class="grid-hint">번호를 눌러 학생을 선택하세요</div>
      <div class="seat-grid" id="penSeatGrid"><div class="loading-txt">로딩중...</div></div>
      <div class="confirm-box" id="penConfirmBox" style="margin-top:12px">
        <div class="confirm-name" id="penConfirmName"></div>
        <div class="confirm-seat" id="penConfirmSeat"></div>
      </div>
      <div id="penInputArea" style="display:none; margin-top:12px">
        <label style="font-size:13px; color:#666; font-weight:600; display:block; margin-bottom:6px">사유</label>
        <input type="text" id="penReason" placeholder="벌점 사유 입력..." style="width:100%; padding:12px 14px; border:1.5px solid #ddd; border-radius:10px; font-size:15px; margin-bottom:10px; background:#fafafa;">
        <label style="font-size:13px; color:#666; font-weight:600; display:block; margin-bottom:6px">벌점</label>
        <div style="display:flex; gap:8px; margin-bottom:14px">
          <button class="pen-pt-btn active" data-pt="1" id="penPt1">1점</button>
          <button class="pen-pt-btn" data-pt="2" id="penPt2">2점</button>
          <button class="pen-pt-btn" data-pt="3" id="penPt3">3점</button>
        </div>
        <button class="btn btn-primary" id="btnGivePenalty">🚨 벌점 부여</button>
      </div>
    </div>
    <div class="card">
      <h3>📋 벌점 현황</h3>
      <div id="penaltyContent" class="loading-txt">로딩중...</div>
      <button class="btn btn-gray" id="btnReloadPenalty">🔄 새로고침</button>
    </div>
  </div>

  <!-- ④ 리포트 탭 (시간대 분석) -->
  <div id="tab-report" style="display:none">
    <div class="card">
      <h3>📩 학부모 발송 리포트</h3>
      <div style="display:flex; gap:8px; margin-bottom:12px">
        <button class="vt-btn active" id="rangeWeek">주간 (최근 7일)</button>
        <button class="vt-btn"        id="rangeMonth">월간 (최근 30일)</button>
      </div>
      <div class="grid-hint">학생을 누르면 리포트가 자동 생성됩니다 (졸음 많은 순)</div>
      <div class="seat-grid" id="repSeatGrid" style="max-height:220px"><div class="loading-txt">생성중...</div></div>
    </div>
    <div class="card" id="repResultCard" style="display:none">
      <button class="btn btn-primary" id="btnCopyReport" style="margin-bottom:10px">📋 이 리포트 복사</button>
      <button class="btn btn-gray" id="btnCopyAll">전체 학생 일괄 복사</button>
      <pre id="repText" class="rep-text"></pre>
    </div>
  </div>

</div>

<script>
var students8   = [];
var students7   = [];
var selectedIdx = -1;
var curFloor    = '8층';
var warnTarget  = null;
var penSelIdx   = -1;
var penFloor    = '8층';
var penPoint    = 1;

setInterval(function() {
  var n = new Date();
  document.getElementById('clock').textContent =
    n.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}, 1000);

document.getElementById('tabRecord').addEventListener('click', function(){ showTab('record'); });
document.getElementById('tabToday').addEventListener('click',  function(){ showTab('today'); });
document.getElementById('tabPenalty').addEventListener('click', function(){ showTab('penalty'); });
document.getElementById('tabReport').addEventListener('click', function(){ showTab('report'); });
document.getElementById('floorBtn8').addEventListener('click', function(){ switchFloor('8층'); });
document.getElementById('floorBtn7').addEventListener('click', function(){ switchFloor('7층'); });
document.getElementById('vtSeat').addEventListener('click', function(){ switchView('seat'); });
document.getElementById('vtName').addEventListener('click', function(){ switchView('name'); });
document.getElementById('searchInput').addEventListener('input', filterNames);
document.getElementById('recordBtn').addEventListener('click', submitRecord);
document.getElementById('btnPenalty').addEventListener('click', doPenalty);
document.getElementById('btnCloseWarn').addEventListener('click', closeWarn);
document.getElementById('btnSuccessOk').addEventListener('click', closeSuccess);

document.getElementById('seatGrid').addEventListener('click', function(e) {
  var btn = e.target.closest('.seat-btn');
  if (btn) selectByIdx(parseInt(btn.getAttribute('data-idx')));
});
document.getElementById('nameList').addEventListener('click', function(e) {
  var item = e.target.closest('.name-item');
  if (item) selectByIdx(parseInt(item.getAttribute('data-idx')));
});

function init() {
  refreshPeriod();
  setInterval(refreshPeriod, 60000);
  google.script.run
    .withSuccessHandler(function(list) {
      students8 = list.filter(function(s){ return s.floor === '8층'; });
      students7 = list.filter(function(s){ return s.floor === '7층'; });
      renderSeatGrid();
      renderNameList(getCurStudents());
    })
    .withFailureHandler(function(e) {
      document.getElementById('seatGrid').innerHTML = '<div class="empty">로딩 실패: ' + e.message + '</div>';
    })
    .getStudentList();
}

function getCurStudents() { return curFloor === '8층' ? students8 : students7; }

function refreshPeriod() {
  google.script.run.withSuccessHandler(function(p) {
    var b = document.getElementById('periodBadge');
    var h = document.getElementById('periodHeader');
    if (!p) { b.textContent = '수업시간 외'; b.className = 'pbadge off'; h.textContent = '수업시간 외'; }
    else if (p.isBreak) { b.textContent = p.label; b.className = 'pbadge brk'; h.textContent = p.label; }
    else { b.textContent = p.label + ' ' + p.start + '~' + p.end; b.className = 'pbadge on'; h.textContent = p.label; }
  }).getCurrentPeriod();
}

function switchFloor(floor) {
  curFloor = floor; selectedIdx = -1;
  document.getElementById('floorBtn8').className = 'floor-tab'    + (floor === '8층' ? ' active' : '');
  document.getElementById('floorBtn7').className = 'floor-tab f7' + (floor === '7층' ? ' active' : '');
  var btn = document.getElementById('recordBtn');
  btn.disabled = true;
  btn.className = 'btn btn-primary' + (floor === '7층' ? ' f7' : '');
  document.getElementById('confirmBox').className = 'confirm-box' + (floor === '7층' ? ' f7' : '');
  document.getElementById('confirmBox').classList.remove('show');
  document.getElementById('searchInput').value = '';
  renderSeatGrid(); renderNameList(getCurStudents());
}

function switchView(v) {
  document.getElementById('view-seat').style.display = v === 'seat' ? '' : 'none';
  document.getElementById('view-name').style.display = v === 'name' ? '' : 'none';
  document.getElementById('vtSeat').className = 'vt-btn' + (v === 'seat' ? ' active' : '');
  document.getElementById('vtName').className = 'vt-btn' + (v === 'name' ? ' active' : '');
}

function renderSeatGrid() {
  var list = getCurStudents();
  var sorted = list.slice().sort(function(a, b) { return (parseInt(a.seat) || 9999) - (parseInt(b.seat) || 9999); });
  if (!sorted.length) { document.getElementById('seatGrid').innerHTML = '<div class="empty">등록된 학생이 없습니다</div>'; return; }
  var selClass = curFloor === '8층' ? 'sel8' : 'sel7';
  var html = '';
  for (var i = 0; i < sorted.length; i++) {
    var s = sorted[i]; var origIdx = list.indexOf(s);
    var sel = origIdx === selectedIdx ? ' ' + selClass : '';
    html += '<button class="seat-btn' + sel + '" data-idx="' + origIdx + '"><span class="sn">' + esc(s.seat) + '</span><span class="snm">' + esc(s.name) + '</span></button>';
  }
  document.getElementById('seatGrid').innerHTML = html;
}

function renderNameList(list) {
  if (!list.length) { document.getElementById('nameList').innerHTML = '<div class="empty">학생이 없습니다</div>'; return; }
  var curList = getCurStudents(); var html = '';
  for (var i = 0; i < list.length; i++) {
    var s = list[i]; var origIdx = curList.indexOf(s);
    var sel = origIdx === selectedIdx ? ' sel' : '';
    html += '<div class="name-item' + sel + '" data-idx="' + origIdx + '"><span class="ni-name">' + esc(s.name) + '</span><span class="ni-seat">' + esc(s.seat) + '번</span></div>';
  }
  document.getElementById('nameList').innerHTML = html;
}

function filterNames() {
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var list = getCurStudents();
  renderNameList(q ? list.filter(function(s){ return s.name.toLowerCase().indexOf(q) !== -1; }) : list);
}

function selectByIdx(idx) {
  var list = getCurStudents();
  if (isNaN(idx) || idx < 0 || idx >= list.length) return;
  selectedIdx = idx; var s = list[idx];
  renderSeatGrid();
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  renderNameList(q ? list.filter(function(st){ return st.name.toLowerCase().indexOf(q) !== -1; }) : list);
  document.getElementById('confirmName').textContent = s.name;
  document.getElementById('confirmSeat').textContent = s.seat + '번 자리 · ' + curFloor;
  var cb = document.getElementById('confirmBox');
  cb.className = 'confirm-box' + (curFloor === '7층' ? ' f7' : '') + ' show';
  var btn = document.getElementById('recordBtn');
  btn.disabled = false;
  btn.className = 'btn btn-primary' + (curFloor === '7층' ? ' f7' : '');
}

function submitRecord() {
  if (selectedIdx < 0) return;
  var s = getCurStudents()[selectedIdx];
  var btn = document.getElementById('recordBtn');
  btn.disabled = true; btn.textContent = '기록 중...';
  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false; btn.textContent = '😴 졸음 기록';
      if (!res.success) { showToast('⚠️ ' + res.message, true); return; }
      selectedIdx = -1;
      renderSeatGrid(); renderNameList(getCurStudents());
      document.getElementById('searchInput').value = '';
      document.getElementById('confirmBox').classList.remove('show');
      document.getElementById('recordBtn').disabled = true;
      showSuccess(res);
      if (res.warn) setTimeout(function(){ showWarn(res); }, 1800);
    })
    .withFailureHandler(function(e) {
      btn.disabled = false; btn.textContent = '😴 졸음 기록';
      showToast('❌ 오류: ' + e.message, true);
    })
    .recordSleep(s.name, s.seat, s.floor);
}

function showSuccess(res) {
  document.getElementById('succName').textContent   = res.name;
  document.getElementById('succPeriod').textContent = res.period + ' 졸음 기록 완료!';
  document.getElementById('succCount').textContent  = '이 교시 ' + res.periodCount + '회';
  var totalEl = document.getElementById('succTotal');
  totalEl.textContent = '누적 총 ' + res.totalCount + '회';
  totalEl.className   = 'success-total' + (res.warn ? ' warn' : '');
  document.getElementById('successBanner').classList.add('show');
}
function closeSuccess() { document.getElementById('successBanner').classList.remove('show'); }

function showWarn(res) {
  warnTarget = res;
  document.getElementById('warnName').textContent  = res.name;
  document.getElementById('warnCount').textContent = res.totalCount;
  document.getElementById('warnBanner').classList.add('show');
}
function closeWarn() { document.getElementById('warnBanner').classList.remove('show'); }
function doPenalty() {
  if (!warnTarget) return;
  var t = warnTarget;
  google.script.run
    .withSuccessHandler(function() {
      closeWarn();
      showToast('🚨 ' + t.name + ' 벌점 1점 기록 완료');
      warnTarget = null;
    })
    .addPenalty(t.name, t.seat || '', t.floor || '', '졸음 누적 ' + t.totalCount + '회');
}

function showTab(name) {
  ['record','today','penalty','report'].forEach(function(t) {
    document.getElementById('tab-' + t).style.display = t === name ? '' : 'none';
  });
  document.getElementById('tabRecord').className  = 'tab' + (name === 'record'  ? ' active' : '');
  document.getElementById('tabToday').className   = 'tab' + (name === 'today'   ? ' active' : '');
  document.getElementById('tabPenalty').className = 'tab' + (name === 'penalty' ? ' active' : '');
  document.getElementById('tabReport').className  = 'tab' + (name === 'report'  ? ' active' : '');
  if (name === 'today')   loadToday();
  if (name === 'report')  loadReport();
  if (name === 'penalty') { renderPenSeatGrid(); loadPenaltyList(); }
}

function loadToday() {
  var el = document.getElementById('todayContent');
  el.className = 'loading-txt'; el.textContent = '로딩중...';
  google.script.run
    .withSuccessHandler(function(list) {
      el.className = '';
      if (!list.length) { el.innerHTML = '<div class="empty">오늘 기록이 없습니다 😴</div>'; return; }
      var html = '';
      for (var i = 0; i < list.length; i++) {
        var r = list[i];
        var tc = r.todayTotal >= 3 ? 't-total t-warn' : 't-total t-ok';
        var fcls = r.floor === '8층' ? 'f8' : 'f7';
        var chips = '';
        for (var j = 0; j < r.chips.length; j++) {
          var c = r.chips[j];
          chips += '<span class="chip' + (c.count > 0 ? ' has' : '') + '">' + esc(c.label) + (c.count > 0 ? ' ' + c.count + '회' : '') + '</span>';
        }
        html += '<div class="today-item"><div class="today-top"><div class="t-left"><span class="t-name">' + esc(r.name) + '</span><span class="t-floor ' + fcls + '">' + r.floor + '</span><span class="t-seat">' + esc(r.seat) + '번</span></div><span class="' + tc + '">오늘 ' + r.todayTotal + '회</span></div><div class="chips">' + chips + '</div></div>';
      }
      el.innerHTML = html;
    })
    .withFailureHandler(function(e) { el.className = ''; el.innerHTML = '<div class="empty">오류: ' + e.message + '</div>'; })
    .getTodayRecords();
}

// ───────────────────────────────────────────────
//  리포트 (일별기록 기반 시간대 분석)
// ───────────────────────────────────────────────
var repRange = 'week';
var repData  = [];
var repSelIdx = -1;
var ACADEMY  = '송도 김엄마관리형독서실';

function loadReport() {
  var grid = document.getElementById('repSeatGrid');
  grid.innerHTML = '<div class="loading-txt">생성중...</div>';
  document.getElementById('repResultCard').style.display = 'none';
  repSelIdx = -1;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.ok) {
        grid.innerHTML = '<div class="empty">' + ((res && res.message) || '데이터가 없습니다') + '</div>';
        repData = []; return;
      }
      repData = res.reports;
      if (!repData.length) { grid.innerHTML = '<div class="empty">해당 기간 졸음 기록이 없습니다</div>'; return; }
      var html = '';
      for (var i = 0; i < repData.length; i++) {
        var r = repData[i];
        var cls = r.total >= 21 ? ' sel8' : '';
        html += '<button class="seat-btn' + cls + '" data-ridx="' + i + '"><span class="sn">' + esc(r.seat || '-') + '</span><span class="snm">' + esc(r.name) + ' ' + r.total + '회</span></button>';
      }
      grid.innerHTML = html;
    })
    .withFailureHandler(function(e) { grid.innerHTML = '<div class="empty">오류: ' + e.message + '</div>'; })
    .getReportTexts(repRange, ACADEMY);
}

document.getElementById('rangeWeek').addEventListener('click', function() {
  repRange = 'week';
  this.className = 'vt-btn active';
  document.getElementById('rangeMonth').className = 'vt-btn';
  loadReport();
});
document.getElementById('rangeMonth').addEventListener('click', function() {
  repRange = 'month';
  this.className = 'vt-btn active';
  document.getElementById('rangeWeek').className = 'vt-btn';
  loadReport();
});

document.getElementById('repSeatGrid').addEventListener('click', function(e) {
  var btn = e.target.closest('.seat-btn');
  if (!btn) return;
  repSelIdx = parseInt(btn.getAttribute('data-ridx'));
  if (isNaN(repSelIdx) || !repData[repSelIdx]) return;
  document.getElementById('repText').textContent = repData[repSelIdx].text;
  document.getElementById('repResultCard').style.display = '';
  document.getElementById('repResultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

document.getElementById('btnCopyReport').addEventListener('click', function() {
  if (repSelIdx < 0 || !repData[repSelIdx]) return;
  copyTextToClipboard(repData[repSelIdx].text);
  showToast('📋 ' + repData[repSelIdx].name + ' 리포트 복사 완료');
});
document.getElementById('btnCopyAll').addEventListener('click', function() {
  if (!repData.length) return;
  var all = repData.map(function(r) { return r.text; }).join('\n\n\n');
  copyTextToClipboard(all);
  showToast('📋 전체 ' + repData.length + '명 리포트 복사 완료');
});

function copyTextToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text);
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }
}

// ───────────────────────────────────────────────
//  벌점 탭
// ───────────────────────────────────────────────
document.getElementById('penFloorBtn8').addEventListener('click', function(){ switchPenFloor('8층'); });
document.getElementById('penFloorBtn7').addEventListener('click', function(){ switchPenFloor('7층'); });
document.getElementById('penSeatGrid').addEventListener('click', function(e) {
  var btn = e.target.closest('.seat-btn');
  if (btn) selectPenByIdx(parseInt(btn.getAttribute('data-idx')));
});
document.getElementById('btnGivePenalty').addEventListener('click', givePenalty);
document.getElementById('btnReloadPenalty').addEventListener('click', loadPenaltyList);
document.querySelectorAll('.pen-pt-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    penPoint = parseInt(this.getAttribute('data-pt'));
    document.querySelectorAll('.pen-pt-btn').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
  });
});

function switchPenFloor(floor) {
  penFloor = floor; penSelIdx = -1;
  document.getElementById('penFloorBtn8').className = 'floor-tab'    + (floor === '8층' ? ' active' : '');
  document.getElementById('penFloorBtn7').className = 'floor-tab f7' + (floor === '7층' ? ' active' : '');
  document.getElementById('penConfirmBox').classList.remove('show');
  document.getElementById('penInputArea').style.display = 'none';
  renderPenSeatGrid();
}

function renderPenSeatGrid() {
  var list = penFloor === '8층' ? students8 : students7;
  var sorted = list.slice().sort(function(a,b){ return (parseInt(a.seat)||9999)-(parseInt(b.seat)||9999); });
  if (!sorted.length) { document.getElementById('penSeatGrid').innerHTML = '<div class="empty">학생이 없습니다</div>'; return; }
  var selClass = penFloor === '8층' ? 'sel8' : 'sel7'; var html = '';
  for (var i = 0; i < sorted.length; i++) {
    var s = sorted[i]; var origIdx = list.indexOf(s);
    var sel = origIdx === penSelIdx ? ' ' + selClass : '';
    html += '<button class="seat-btn' + sel + '" data-idx="' + origIdx + '"><span class="sn">' + esc(s.seat) + '</span><span class="snm">' + esc(s.name) + '</span></button>';
  }
  document.getElementById('penSeatGrid').innerHTML = html;
}

function selectPenByIdx(idx) {
  var list = penFloor === '8층' ? students8 : students7;
  if (isNaN(idx) || idx < 0 || idx >= list.length) return;
  penSelIdx = idx; var s = list[idx];
  renderPenSeatGrid();
  document.getElementById('penConfirmName').textContent = s.name;
  document.getElementById('penConfirmSeat').textContent = s.seat + '번 자리 · ' + penFloor;
  var cb = document.getElementById('penConfirmBox');
  cb.className = 'confirm-box' + (penFloor === '7층' ? ' f7' : '') + ' show';
  document.getElementById('penInputArea').style.display = '';
}

function givePenalty() {
  if (penSelIdx < 0) return;
  var list = penFloor === '8층' ? students8 : students7;
  var s = list[penSelIdx];
  var reason = document.getElementById('penReason').value.trim() || '수동 벌점';
  var btn = document.getElementById('btnGivePenalty');
  btn.disabled = true; btn.textContent = '처리 중...';
  google.script.run
    .withSuccessHandler(function() {
      btn.disabled = false; btn.textContent = '🚨 벌점 부여';
      showToast('🚨 ' + s.name + ' 벌점 ' + penPoint + '점 부여 완료');
      document.getElementById('penReason').value = '';
      penSelIdx = -1; renderPenSeatGrid();
      document.getElementById('penConfirmBox').classList.remove('show');
      document.getElementById('penInputArea').style.display = 'none';
      loadPenaltyList();
    })
    .withFailureHandler(function(e) { btn.disabled = false; btn.textContent = '🚨 벌점 부여'; showToast('❌ 오류: ' + e.message, true); })
    .addPenalty(s.name, s.seat, s.floor, reason, penPoint);
}

function loadPenaltyList() {
  var el = document.getElementById('penaltyContent');
  el.className = 'loading-txt'; el.textContent = '로딩중...';
  google.script.run
    .withSuccessHandler(function(list) {
      el.className = '';
      if (!list.length) { el.innerHTML = '<div class="empty">벌점 기록이 없습니다</div>'; return; }
      var html = '';
      for (var i = 0; i < list.length; i++) {
        var r = list[i]; var fcls = r.floor === '8층' ? 'f8' : 'f7';
        html += '<div class="pen-list-item"><div class="t-left"><span class="pen-name">' + esc(r.name) + '</span><span class="t-floor ' + fcls + '">' + r.floor + '</span><span class="t-seat">' + esc(r.seat) + '번</span></div><span class="pen-total">' + r.total + '점</span></div>';
      }
      el.innerHTML = html;
    })
    .withFailureHandler(function(e) { el.className = ''; el.innerHTML = '<div class="empty">오류: ' + e.message + '</div>'; })
    .getPenaltyList();
}

function showToast(msg, isErr) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (isErr ? ' err' : '') + ' show';
  setTimeout(function() { el.classList.remove('show'); }, 3500);
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

init();
</script>
</body>
</html>
